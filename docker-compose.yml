version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vanquish-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vanquish
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vanquish-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: kimzvik@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

  server:
    build: ./server
    container_name: vanquish-server
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      - ${HOME}/Downloads:/downloads
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/vanquish
      PORT: 4000
      NIST_KEY: ${NIST_KEY}
    depends_on:
      - postgres

  client:
    build: ./client
    container_name: vanquish-client
    restart: unless-stopped
    ports:
      - '3000:80'
    environment:
      VITE_API_BASE: http://localhost:4000
    depends_on:
      - server

volumes:
  postgres-data:
    driver: local
