server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # In docker-compose, nginx proxies /api to the backend container.
    # In ECS, the ALB routes /api/* to the backend service before requests
    # reach nginx, so this block is never invoked in production.
    # Using a variable + resolver defers DNS lookup to request time,
    # preventing startup failure when 'server' is not resolvable.
    location /api {
        resolver 127.0.0.11 169.254.169.253 valid=10s ipv6=off;
        set $backend http://server:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
